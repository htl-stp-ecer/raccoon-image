name: Update dev manifest

on:
  repository_dispatch:
    types: [component-released]
  workflow_dispatch:

jobs:
  update-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Reads other repositories' releases and pushes to main as the Raccoon OS Bot,
      # not with a personal token.
      - name: Create an app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: htl-stp-ecer
          repositories: raccoon-image
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Get latest component versions
        id: versions
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          LIB=$(gh release view --repo htl-stp-ecer/raccoon-lib --json tagName -q .tagName 2>/dev/null || echo "")
          CLI=$(gh release view --repo htl-stp-ecer/raccoon-cli --json tagName -q .tagName 2>/dev/null || echo "")
          STM32=$(gh release view --repo htl-stp-ecer/stm32-data-reader --json tagName -q .tagName 2>/dev/null || echo "")
          CAM=$(gh release view --repo htl-stp-ecer/raccoon-cam --json tagName -q .tagName 2>/dev/null || echo "")
          BOTUI=$(gh release view --repo htl-stp-ecer/botui --json tagName -q .tagName 2>/dev/null || echo "")
          echo "lib=$LIB" >> $GITHUB_OUTPUT
          echo "cli=$CLI" >> $GITHUB_OUTPUT
          echo "stm32=$STM32" >> $GITHUB_OUTPUT
          echo "cam=$CAM" >> $GITHUB_OUTPUT
          echo "botui=$BOTUI" >> $GITHUB_OUTPUT

      - name: Write bundles/dev.json
        run: |
          mkdir -p bundles
          python3 -c "
          import json
          manifest = {
              'bundle': 'dev',
              'components': {
                  'raccoon-lib':       '${{ steps.versions.outputs.lib }}',
                  'raccoon-cli':       '${{ steps.versions.outputs.cli }}',
                  'stm32-data-reader': '${{ steps.versions.outputs.stm32 }}',
                  'raccoon-cam':       '${{ steps.versions.outputs.cam }}',
                  'botui':             '${{ steps.versions.outputs.botui }}',
              }
          }
          print(json.dumps(manifest, indent=2))
          " > bundles/dev.json
          cat bundles/dev.json

      - name: Commit and push
        run: |
          git config user.name  "raccoon-os-bot[bot]"
          git config user.email "raccoon-os-bot[bot]@users.noreply.github.com"
          git add bundles/dev.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update dev manifest [skip ci]"
          git push
