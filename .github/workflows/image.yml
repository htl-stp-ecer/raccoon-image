name: Build updated image

on:
  # Create Bundle starts the build with this event: sending it needs only contents: write,
  # which the Raccoon OS Bot has (starting a workflow_dispatch would need actions: write).
  # client_payload: { "bundle": "<name>", "publish": true }
  repository_dispatch:
    types: [build-image]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release (disable for a build-only test)
        type: boolean
        default: false
      bundle:
        description: Bundle to build, e.g. 2026.5.25.1 (empty = the one bundles/latest.json points to)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts
        run: |
          bash -n scripts/build-image.sh scripts/update-image-root.sh
          shellcheck scripts/*.sh
          python3 -m unittest discover -s tests -v

  build:
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs fdisk parted xz-utils
      - name: Download and verify release inputs
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ inputs.bundle || github.event.client_payload.bundle }}
        run: python3 scripts/download-image-inputs.py "$RUNNER_TEMP/inputs" "$BUNDLE"
      - name: Build image
        run: |
          mkdir -p "$RUNNER_TEMP/output"
          sudo bash scripts/build-image.sh "$RUNNER_TEMP/inputs" "$RUNNER_TEMP/output"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/output"
          # GitHub release assets must be smaller than 2 GiB.
          test "$(stat -c %s "$RUNNER_TEMP/output/raccoon-os.img.xz")" -lt 2147483648
      - uses: actions/upload-artifact@v4
        with:
          name: raccoon-image
          path: ${{ runner.temp }}/output/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    if: >-
      github.repository == 'htl-stp-ecer/raccoon-image' &&
      github.ref == 'refs/heads/main' &&
      (inputs.publish || github.event.client_payload.publish == true)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: raccoon-image
          path: output
      - name: Publish monthly image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          bundle=$(jq -r .bundle output/manifest.json)
          tag="$bundle"
          cat > notes.md <<'NOTES'
          To install this image, refer to [the RaccoonOS quick start guide](https://raccoon-docs.pages.dev/00-quick-start/).

          Contains the following components:
          
          NOTES
          jq -r '.components | to_entries[] | select(.key != "raccoon-sim")
                 | "- \(.key): \(.value.tag)"' output/manifest.json >> notes.md
          # Bundles with a transport contract also name its hash.
          jq -r '.components["raccoon-transport"].contract_hash // empty
                 | "- transport contract hash: \(.)"' output/manifest.json >> notes.md
          # Create a draft first so users never see a partially uploaded release.
          gh release create "$tag" --target "$BUILD_SHA" --draft \
            --title "RaccoonOS $bundle" \
            --notes-file notes.md output/*
          gh release edit "$tag" --draft=false --latest
